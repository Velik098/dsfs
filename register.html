<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Moneyway — Регистрация</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="page-auth" data-page="register">
  <main class="auth">
    <div class="auth-card">
      <div class="brand auth-brand">
        <div class="brand-icon">MW</div>
        <div>
          <div class="brand-title">Moneyway</div>
          <div class="brand-subtitle">Регистрация</div>
        </div>
      </div>

      <h1>Создать аккаунт</h1>
      <p class="muted">Соберите профиль, чтобы публиковать проекты и общаться.</p>

      <form class="auth-form">
        <label>
          Имя
          <input type="text" placeholder="Иван Иванов" required />
        </label>
        <label>
          Почта
          <input type="email" placeholder="you@studio.com" required />
        </label>
        <label>
          Пароль
          <input type="password" placeholder="Минимум 8 символов" required />
        </label>
        <label>
          Роль
          <select>
            <option>Дизайнер</option>
            <option>Разработчик</option>
            <option>Менеджер</option>
            <option>Маркетолог</option>
            <option>Автор</option>
          </select>
        </label>

        <button class="btn btn-primary btn-block" type="submit">Создать аккаунт</button>
        <button class="btn btn-secondary btn-block" type="button"><i class="fa-brands fa-github"></i> Продолжить с GitHub</button>
      </form>

      <div class="auth-footer">
        Уже есть аккаунт? <a href="login.html">Войти</a>
      </div>
    </div>
  </main>

  <script src="assets/js/app.js"></script>
</body>
</html>
