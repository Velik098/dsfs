<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Moneyway Social — Create Post</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Sora:wght@300;400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body class="page-create" data-page="create">
  <div class="bg-orb bg-orb-a"></div>
  <div class="bg-orb bg-orb-b"></div>
  <div class="bg-grid"></div>

  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-icon">MW</div>
        <div>
          <div class="brand-title">Moneyway</div>
          <div class="brand-subtitle">Social Freelance</div>
        </div>
      </div>

      <nav class="nav">
        <a class="nav-link" href="index.html"><i class="fa-solid fa-house"></i>Feed</a>
        <a class="nav-link" href="profile.html"><i class="fa-solid fa-user"></i>Profile</a>
        <a class="nav-link is-active" href="post.html"><i class="fa-solid fa-pen"></i>Create</a>
        <a class="nav-link" href="messages.html"><i class="fa-solid fa-comments"></i>Messages</a>
        <a class="nav-link" href="settings.html"><i class="fa-solid fa-gear"></i>Settings</a>
      </nav>

      <div class="sidebar-card glass">
        <div class="avatar avatar-lg">AL</div>
        <div class="user-meta">
          <div class="user-name">Aline Moore</div>
          <div class="user-role">Product Designer</div>
        </div>
        <button class="btn btn-primary">Draft Brief</button>
      </div>
    </aside>

    <header class="topbar glass">
      <div class="search">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="search" placeholder="Search projects, creators, tags" />
      </div>
      <div class="topbar-actions">
        <button class="btn btn-ghost"><i class="fa-regular fa-bell"></i></button>
        <button class="btn btn-ghost"><i class="fa-regular fa-message"></i></button>
        <div class="avatar">AL</div>
      </div>
    </header>

    <main class="content">
      <section class="create-hero glass">
        <div>
          <h1>Create a new brief</h1>
          <p>Share your project like a post. Attract the right creators quickly.</p>
        </div>
        <button class="btn btn-secondary">Save draft</button>
      </section>

      <section class="create-form glass">
        <form>
          <div class="form-grid">
            <label>
              Project title
              <input type="text" placeholder="Premium fintech onboarding" />
            </label>
            <label>
              Category
              <select>
                <option>Branding</option>
                <option>UI / UX</option>
                <option>Web build</option>
                <option>Motion</option>
                <option>Product Strategy</option>
              </select>
            </label>
            <label class="full">
              Project summary
              <textarea rows="4" placeholder="Describe the scope, goals, and timeline."></textarea>
            </label>
            <label>
              Budget range
              <input type="range" min="2000" max="20000" value="6500" data-range="budget" />
              <div class="range-value" data-range-value>$6,500</div>
            </label>
            <label>
              Deadline
              <input type="date" />
            </label>
            <label class="full">
              Tags
              <input type="text" placeholder="Fintech, UI Kit, Webflow" />
            </label>
          </div>
          <div class="form-actions">
            <button class="btn btn-ghost" type="button">Preview</button>
            <button class="btn btn-primary" type="submit">Publish</button>
          </div>
        </form>
      </section>
    </main>
  </div>

  <script src="assets/js/app.js"></script>
</body>
</html>
