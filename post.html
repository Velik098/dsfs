<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Moneyway — Проекты</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="page-create" data-page="create">
  <div class="app-shell">
    <header class="topbar">
      <a class="topbar-brand brand" href="index.html" aria-label="Moneyway — Лента">
        <div class="brand-icon">MW</div>
        <div>
          <div class="brand-title">Moneyway</div>
          <div class="brand-subtitle">Социальная фриланс-сеть</div>
        </div>
      </a>

      <div class="topbar-center">
        <div class="search">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input type="search" placeholder="Поиск проектов, людей, тегов" />
        </div>

        <div class="topbar-actions">
          <button class="btn btn-ghost" aria-label="Уведомления"><i class="fa-regular fa-bell"></i></button>
          <button class="btn btn-ghost" aria-label="Сообщения"><i class="fa-regular fa-message"></i></button>
          <div class="profile-menu" data-profile-menu>
            <button class="avatar avatar-button" type="button" aria-label="Меню профиля" aria-haspopup="menu" aria-expanded="false" data-profile-menu-button>Я</button>
            <div class="profile-dropdown" role="menu" aria-label="Профиль" data-profile-menu-dropdown>
              <a class="menu-item" role="menuitem" href="profile.html#edit-profile"><i class="fa-solid fa-user-gear"></i>Управление аккаунтом</a>
              <a class="menu-item" role="menuitem" href="settings.html"><i class="fa-solid fa-gear"></i>Настройки</a>
              <div class="menu-sep" role="separator"></div>
              <button class="menu-item" type="button" role="menuitem" data-action="switch-account"><i class="fa-solid fa-right-left"></i>Сменить аккаунт</button>
              <button class="menu-item" type="button" role="menuitem" data-action="logout"><i class="fa-solid fa-right-from-bracket"></i>Выйти</button>
            </div>
          </div>
        </div>
      </div>
    </header>

    <aside class="sidebar">
      <nav class="nav">
        <a class="nav-link" href="index.html"><i class="fa-solid fa-house"></i>Лента</a>
        <a class="nav-link" href="profile.html"><i class="fa-solid fa-user"></i>Профиль</a>
        <a class="nav-link is-active" href="post.html"><i class="fa-solid fa-pen"></i>Проекты</a>
        <a class="nav-link" href="messages.html"><i class="fa-solid fa-comments"></i>Сообщения</a>
      </nav>
    </aside>

    <main class="content">
      <section class="create-hero">
        <div>
          <h1>Проекты</h1>
          <p>Создавайте и публикуйте проекты — так их быстрее увидят нужные специалисты.</p>
        </div>
        <button class="btn btn-secondary">Сохранить черновик</button>
      </section>

      <section class="create-form">
        <form>
          <div class="form-grid">
            <label>
              Название
              <input type="text" placeholder="Онбординг для финтех-приложения" />
            </label>
            <label>
              Категория
              <select>
                <option>Брендинг</option>
                <option>Интерфейсы</option>
                <option>Веб</option>
                <option>Анимация</option>
                <option>Продукт</option>
              </select>
            </label>
            <label class="full">
              Описание
              <textarea rows="4" placeholder="Коротко опишите задачу, объём работ и ожидания по срокам."></textarea>
            </label>
            <label>
              Бюджет
              <input type="range" min="50000" max="2000000" step="10000" value="650000" data-range="budget" />
              <div class="range-value" data-range-value>650 000 ₽</div>
            </label>
            <label>
              Срок
              <input type="date" />
            </label>
            <label class="full">
              Теги
              <input type="text" placeholder="Финтех, лендинг, дизайн-система" />
            </label>
          </div>
          <div class="form-actions">
            <button class="btn btn-ghost" type="button">Предпросмотр</button>
            <button class="btn btn-primary" type="submit">Опубликовать</button>
          </div>
        </form>
      </section>
    </main>
  </div>

  <script src="assets/js/app.js"></script>
</body>
</html>
