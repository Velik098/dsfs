<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Moneyway — Посты</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="page-posts" data-page="posts">
  <div class="app-shell">
    <header class="topbar">
      <a class="topbar-brand brand" href="index.html" aria-label="Moneyway — Лента">
        <div class="brand-icon">MW</div>
        <div>
          <div class="brand-title">Moneyway</div>
          <div class="brand-subtitle">Социальная фриланс-сеть</div>
        </div>
      </a>

      <div class="topbar-center">
        <div class="search">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input type="search" placeholder="Поиск постов и людей" />
        </div>

        <div class="topbar-actions">
          <button class="btn btn-ghost" aria-label="Уведомления"><i class="fa-regular fa-bell"></i></button>
          <div class="auth-actions">
            <a class="btn btn-ghost" href="login.html">Войти</a>
            <a class="btn btn-primary" href="register.html">Регистрация</a>
          </div>
          <div class="profile-menu" data-profile-menu>
            <button class="avatar avatar-button" type="button" aria-label="Меню профиля" aria-haspopup="menu" aria-expanded="false" data-profile-menu-button>Я</button>
            <div class="profile-dropdown" role="menu" aria-label="Профиль" data-profile-menu-dropdown>
              <a class="menu-item" role="menuitem" href="profile.html#edit-profile"><i class="fa-solid fa-user-gear"></i>Управление аккаунтом</a>
              <a class="menu-item" role="menuitem" href="settings.html"><i class="fa-solid fa-gear"></i>Настройки</a>
              <div class="menu-sep" role="separator"></div>
              <button class="menu-item" type="button" role="menuitem" data-action="switch-account"><i class="fa-solid fa-right-left"></i>Сменить аккаунт</button>
              <button class="menu-item" type="button" role="menuitem" data-action="logout"><i class="fa-solid fa-right-from-bracket"></i>Выйти</button>
            </div>
          </div>
        </div>
      </div>
    </header>

    <aside class="sidebar">
      <nav class="nav">
        <a class="nav-link" href="index.html"><i class="fa-solid fa-house"></i>Лента</a>
        <a class="nav-link is-active" href="posts.html"><i class="fa-regular fa-file-lines"></i>Посты</a>
        <a class="nav-link" href="profile.html" data-auth-required="1"><i class="fa-solid fa-user"></i>Профиль</a>
        <a class="nav-link" href="post.html" data-auth-required="1"><i class="fa-solid fa-pen"></i>Проекты</a>
        <a class="nav-link" href="messages.html" data-auth-required="1"><i class="fa-solid fa-comments"></i>Сообщения<span class="nav-badge" data-badge="messages" aria-hidden="true"></span></a>
      </nav>
    </aside>

    <main class="content">
      <section class="create-form">
        <div class="feed-header">
          <h2>Новый пост</h2>
          <div class="muted" id="postComposerHint"></div>
        </div>

        <form id="postForm">
          <div class="form-grid">
            <label class="full">
              Текст
              <textarea name="body" rows="3" placeholder="Что нового?"></textarea>
            </label>
            <label class="full">
              Изображение (необязательно)
              <input type="file" name="image" accept="image/*" />
            </label>
            <div class="full">
              <div class="post-media" id="postImagePreview"></div>
            </div>
          </div>
          <div class="form-actions">
            <button class="btn btn-primary" type="submit">Опубликовать</button>
          </div>
        </form>
      </section>

      <section class="feed">
        <div class="feed-header">
          <h2>Публикации</h2>
        </div>
        <div class="feed-list" id="postsFeedList"></div>
      </section>
    </main>

    <aside class="rightbar">
      <div class="rightbar-card">
        <h3>Подсказка</h3>
        <div class="muted">Посты видны всем. Лайки, комментарии и репосты доступны после входа.</div>
      </div>
    </aside>
  </div>

  <script src="assets/js/app.js"></script>
</body>
</html>
