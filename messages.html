<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Moneyway — Сообщения</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="page-messages" data-page="messages">
  <div class="app-shell">
    <header class="topbar">
      <a class="topbar-brand brand" href="index.html" aria-label="Moneyway — Лента">
        <div class="brand-icon">MW</div>
        <div>
          <div class="brand-title">Moneyway</div>
          <div class="brand-subtitle">Социальная фриланс-сеть</div>
        </div>
      </a>

      <div class="topbar-center">
        <div class="search">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input type="search" placeholder="Поиск проектов, людей, тегов" />
        </div>

        <div class="topbar-actions">
          <button class="btn btn-ghost" aria-label="Уведомления"><i class="fa-regular fa-bell"></i></button>
          <button class="btn btn-ghost" aria-label="Сообщения"><i class="fa-regular fa-message"></i></button>
          <div class="profile-menu" data-profile-menu>
            <button class="avatar avatar-button" type="button" aria-label="Меню профиля" aria-haspopup="menu" aria-expanded="false" data-profile-menu-button>Я</button>
            <div class="profile-dropdown" role="menu" aria-label="Профиль" data-profile-menu-dropdown>
              <a class="menu-item" role="menuitem" href="profile.html#edit-profile"><i class="fa-solid fa-user-gear"></i>Управление аккаунтом</a>
              <a class="menu-item" role="menuitem" href="settings.html"><i class="fa-solid fa-gear"></i>Настройки</a>
              <div class="menu-sep" role="separator"></div>
              <button class="menu-item" type="button" role="menuitem" data-action="switch-account"><i class="fa-solid fa-right-left"></i>Сменить аккаунт</button>
              <button class="menu-item" type="button" role="menuitem" data-action="logout"><i class="fa-solid fa-right-from-bracket"></i>Выйти</button>
            </div>
          </div>
        </div>
      </div>
    </header>

    <aside class="sidebar">
      <nav class="nav">
        <a class="nav-link" href="index.html"><i class="fa-solid fa-house"></i>Лента</a>
        <a class="nav-link" href="profile.html"><i class="fa-solid fa-user"></i>Профиль</a>
        <a class="nav-link" href="post.html"><i class="fa-solid fa-pen"></i>Проекты</a>
        <a class="nav-link is-active" href="messages.html"><i class="fa-solid fa-comments"></i>Сообщения</a>
      </nav>
    </aside>

    <main class="content messages-layout">
      <section class="messages-list">
        <div class="list-header">
          <h2>Диалоги</h2>
          <button class="btn btn-ghost" aria-label="Фильтр"><i class="fa-solid fa-filter"></i></button>
        </div>

        <div class="dialog-search">
          <div class="search search--compact">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="search" id="peopleSearch" placeholder="Поиск людей для сообщения" autocomplete="off" />
          </div>
          <div class="people-results" id="peopleResults" aria-label="Результаты поиска"></div>
        </div>

        <div class="muted" id="dialogsEmpty">Пока нет диалогов. Откройте профиль пользователя и нажмите «Написать».</div>
        <div id="dialogsList"></div>
      </section>

      <section class="chat-panel">
        <div class="chat-header">
          <div>
            <div class="chat-name" id="chatName">Выберите диалог</div>
            <div class="chat-status muted" id="chatStatus"></div>
          </div>
          <div class="chat-actions">
            <button class="btn btn-ghost" aria-label="Видеозвонок"><i class="fa-solid fa-video"></i></button>
            <button class="btn btn-ghost" aria-label="Звонок"><i class="fa-solid fa-phone"></i></button>
            <button class="btn btn-ghost" aria-label="Ещё"><i class="fa-solid fa-ellipsis"></i></button>
          </div>
        </div>

        <div class="chat-thread" id="chatThread"></div>

        <form class="chat-input" id="chatForm">
          <input type="text" placeholder="Написать сообщение" id="chatMessage" autocomplete="off" />
          <button class="btn btn-primary" type="submit">Отправить</button>
        </form>
      </section>
    </main>
  </div>

  <script src="assets/js/app.js"></script>
</body>
</html>
