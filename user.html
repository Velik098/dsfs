<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Moneyway - Профиль</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="page-user" data-page="user">
  <div class="app-shell">
    <header class="topbar">
      <a class="topbar-brand brand" href="index.html" aria-label="Moneyway - Лента">
        <div class="brand-icon">MW</div>
        <div>
          <div class="brand-title">Moneyway</div>
          <div class="brand-subtitle">Социальная фриланс-сеть</div>
        </div>
      </a>

      <div class="topbar-center">
        <div class="search">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input type="search" placeholder="Поиск людей и проектов" />
        </div>

        <div class="topbar-actions">
          <button class="btn btn-ghost" aria-label="Уведомления"><i class="fa-regular fa-bell"></i></button>
          <div class="profile-menu" data-profile-menu>
            <button class="avatar avatar-button" type="button" aria-label="Меню профиля" aria-haspopup="menu" aria-expanded="false" data-profile-menu-button>Я</button>
            <div class="profile-dropdown" role="menu" aria-label="Профиль" data-profile-menu-dropdown>
              <a class="menu-item" role="menuitem" href="profile.html#edit-profile"><i class="fa-solid fa-user-gear"></i>Управление аккаунтом</a>
              <a class="menu-item" role="menuitem" href="settings.html"><i class="fa-solid fa-gear"></i>Настройки</a>
              <div class="menu-sep" role="separator"></div>
              <button class="menu-item" type="button" role="menuitem" data-action="switch-account"><i class="fa-solid fa-right-left"></i>Сменить аккаунт</button>
              <button class="menu-item" type="button" role="menuitem" data-action="logout"><i class="fa-solid fa-right-from-bracket"></i>Выйти</button>
            </div>
          </div>
        </div>
      </div>
    </header>

    <aside class="sidebar">
      <nav class="nav">
        <a class="nav-link" href="index.html"><i class="fa-solid fa-house"></i>Лента</a>
        <a class="nav-link" href="profile.html" data-auth-required="1"><i class="fa-solid fa-user"></i>Профиль</a>
        <a class="nav-link" href="post.html" data-auth-required="1"><i class="fa-solid fa-pen"></i>Проекты</a>
        <a class="nav-link" href="messages.html" data-auth-required="1"><i class="fa-solid fa-comments"></i>Сообщения<span class="nav-badge" data-badge="messages" aria-hidden="true"></span></a>
      </nav>
    </aside>

    <main class="content">
      <div class="profile-column">
        <section class="profile-card" aria-label="Профиль пользователя">
          <div class="profile-cover" id="userCover"></div>

          <div class="profile-body">
            <div class="profile-avatar" id="userAvatar">?</div>

            <div class="profile-head">
              <div class="profile-ident">
                <h1 class="profile-name" id="userName">Профиль</h1>
                <div class="profile-username" id="userUsername">@mw</div>
              </div>

              <div class="profile-head-actions">
                <button class="profile-action-btn" type="button" id="userFollowBtn" data-toggle="follow">Подписаться</button>
                <a class="profile-icon-btn" id="userMessageBtn" href="messages.html" aria-label="Написать сообщение">
                  <i class="fa-regular fa-paper-plane"></i>
                </a>
              </div>
            </div>

            <div class="profile-meta">
              <div class="profile-role muted" id="userRole"></div>
              <div class="profile-bio muted" id="userBio">Пользователь пока ничего не рассказал о себе.</div>
            </div>

            <div class="profile-stats-line" aria-label="Статистика">
              <div class="profile-stat">
                <span class="profile-stat-label">Регистрация:</span>
                <span class="profile-stat-value" id="userStatRegistered">-</span>
              </div>
              <div class="profile-stat">
                <span class="profile-stat-label">Подписки:</span>
                <span class="profile-stat-value" id="userStatFollowing">0</span>
              </div>
              <div class="profile-stat">
                <span class="profile-stat-label">Подписчики:</span>
                <span class="profile-stat-value" id="userStatFollowers">0</span>
              </div>
            </div>
          </div>

          <div class="profile-tabs" role="tablist" aria-label="Разделы профиля пользователя">
            <button class="profile-tab is-active" type="button" role="tab" aria-selected="true" data-tab="posts">Посты</button>
            <button class="profile-tab" type="button" role="tab" aria-selected="false" data-tab="projects">Проекты</button>
          </div>

          <div class="profile-panels">
            <div class="profile-panel is-active" data-tabpanel="posts" role="tabpanel">
              <div class="profile-stream" id="userPostsList" aria-label="Посты пользователя"></div>
            </div>

            <div class="profile-panel" data-tabpanel="projects" role="tabpanel" hidden>
              <div class="profile-stream" id="userProjectsList" aria-label="Проекты пользователя"></div>
            </div>
          </div>
        </section>
      </div>
    </main>
  </div>

  <script src="assets/js/app.js"></script>
</body>
</html>
