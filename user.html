<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Moneyway — Профиль</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="page-user" data-page="user">
  <div class="app-shell">
    <header class="topbar">
      <a class="topbar-brand brand" href="index.html" aria-label="Moneyway — Лента">
        <div class="brand-icon">MW</div>
        <div>
          <div class="brand-title">Moneyway</div>
          <div class="brand-subtitle">Социальная фриланс-сеть</div>
        </div>
      </a>

      <div class="topbar-center">
        <div class="search">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input type="search" placeholder="Поиск проектов, людей, тегов" />
        </div>

        <div class="topbar-actions">
          <button class="btn btn-ghost" aria-label="Уведомления"><i class="fa-regular fa-bell"></i></button>
          <button class="btn btn-ghost" aria-label="Сообщения"><i class="fa-regular fa-message"></i></button>
          <div class="auth-actions">
            <a class="btn btn-ghost" href="login.html">Войти</a>
            <a class="btn btn-primary" href="register.html">Регистрация</a>
          </div>
          <div class="profile-menu" data-profile-menu>
            <button class="avatar avatar-button" type="button" aria-label="Меню профиля" aria-haspopup="menu" aria-expanded="false" data-profile-menu-button>Я</button>
            <div class="profile-dropdown" role="menu" aria-label="Профиль" data-profile-menu-dropdown>
              <a class="menu-item" role="menuitem" href="profile.html#edit-profile"><i class="fa-solid fa-user-gear"></i>Управление аккаунтом</a>
              <a class="menu-item" role="menuitem" href="settings.html"><i class="fa-solid fa-gear"></i>Настройки</a>
              <div class="menu-sep" role="separator"></div>
              <button class="menu-item" type="button" role="menuitem" data-action="switch-account"><i class="fa-solid fa-right-left"></i>Сменить аккаунт</button>
              <button class="menu-item" type="button" role="menuitem" data-action="logout"><i class="fa-solid fa-right-from-bracket"></i>Выйти</button>
            </div>
          </div>
        </div>
      </div>
    </header>

    <aside class="sidebar">
      <nav class="nav">
        <a class="nav-link" href="index.html"><i class="fa-solid fa-house"></i>Лента</a>
        <a class="nav-link" href="profile.html" data-auth-required="1"><i class="fa-solid fa-user"></i>Профиль</a>
        <a class="nav-link" href="post.html" data-auth-required="1"><i class="fa-solid fa-pen"></i>Проекты</a>
        <a class="nav-link" href="messages.html" data-auth-required="1"><i class="fa-solid fa-comments"></i>Сообщения</a>
      </nav>
    </aside>

    <main class="content">
      <section class="profile-hero">
        <div class="profile-main">
          <div class="avatar avatar-xl" id="userAvatar">?</div>
          <div>
            <h1 id="userName">Профиль</h1>
            <div class="muted" id="userRole"></div>
          </div>
        </div>
        <div class="profile-actions">
          <button class="btn btn-primary" type="button" id="userFollowBtn" data-toggle="follow">Подписаться</button>
          <a class="btn btn-secondary" id="userMessageBtn" href="messages.html">Написать</a>
        </div>
      </section>

      <section class="profile-stats">
        <div class="stat">
          <div class="stat-value" id="userStatProjects">0</div>
          <div class="stat-label">Проекты</div>
        </div>
        <div class="stat">
          <div class="stat-value" id="userStatFollowers">0</div>
          <div class="stat-label">Подписчики</div>
        </div>
        <div class="stat">
          <div class="stat-value" id="userStatRating">0</div>
          <div class="stat-label">Рейтинг</div>
        </div>
      </section>

      <section class="profile-about">
        <h2>О себе</h2>
        <p class="muted" id="userBio">Пользователь пока ничего не рассказал о себе.</p>
      </section>

      <section class="feed">
        <div class="feed-header">
          <h2>Проекты</h2>
        </div>
        <div class="feed-list" id="userProjectsList"></div>
      </section>
    </main>
  </div>

  <script src="assets/js/app.js"></script>
</body>
</html>
