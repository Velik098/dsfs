<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Moneyway — Вход</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="page-auth" data-page="login">
  <main class="auth">
    <div class="auth-card">
      <div class="brand auth-brand">
        <div class="brand-icon">MW</div>
        <div>
          <div class="brand-title">Moneyway</div>
          <div class="brand-subtitle">Вход в аккаунт</div>
        </div>
      </div>

      <h1>Войти</h1>
      <p class="muted">Доступ к ленте, сообщениям и проектам.</p>

      <form class="auth-form">
        <label>
          Почта
          <input type="email" placeholder="you@studio.com" required />
        </label>
        <label>
          Пароль
          <input type="password" placeholder="Введите пароль" required />
        </label>
        <div class="auth-row">
          <label class="checkbox">
            <input type="checkbox" />
            <span>Не выходить</span>
          </label>
          <a href="#">Забыли пароль?</a>
        </div>

        <button class="btn btn-primary btn-block" type="submit">Войти</button>
        <button class="btn btn-secondary btn-block" type="button"><i class="fa-brands fa-google"></i> Войти через Google</button>
      </form>

      <div class="auth-footer">
        Нет аккаунта? <a href="register.html">Зарегистрироваться</a>
      </div>
    </div>
  </main>

  <script src="assets/js/app.js"></script>
</body>
</html>
