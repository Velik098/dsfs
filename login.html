<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Moneyway — Вход</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="page-auth" data-page="login">
  <main class="auth">
    <div class="auth-card">
      <div class="brand auth-brand">
        <div class="brand-icon">MW</div>
        <div>
          <div class="brand-title">Moneyway</div>
          <div class="brand-subtitle">Вход в аккаунт</div>
        </div>
      </div>

      <h1>Войти</h1>
      <p class="muted">Почта или номер телефона — и вы снова в ленте.</p>

      <div class="auth-error" id="authError" role="alert" aria-live="polite"></div>

      <form class="auth-form" id="loginForm">
        <label>
          Почта или телефон
          <input type="text" name="identifier" inputmode="email" placeholder="you@studio.com или +7 900 000-00-00" required />
        </label>
        <label>
          Пароль
          <input type="password" name="password" placeholder="Введите пароль" required />
        </label>
        <div class="auth-row">
          <label class="checkbox">
            <input type="checkbox" name="remember" />
            <span>Запомнить меня</span>
          </label>
          <a href="#">Забыли пароль?</a>
        </div>

        <button class="btn btn-primary btn-block" type="submit">Войти</button>
      </form>

      <div class="auth-footer">
        Нет аккаунта? <a href="register.html">Зарегистрироваться</a>
      </div>

      <div class="auth-legal muted" aria-label="Документы">
        <a href="terms.html">Условия обслуживания</a>
        <span>|</span>
        <a href="privacy.html">Политика конфиденциальности</a>
        <span>|</span>
        <a href="cookies.html">Политика использования cookie-файлов</a>
        <span>|</span>
        <a href="accessibility.html">Специальные возможности</a>
        <span>|</span>
        <a href="ads.html">Информация о рекламе</a>
        <span>|</span>
        <span>© 2026</span>
      </div>
    </div>
  </main>

  <script src="assets/js/app.js"></script>
</body>
</html>
