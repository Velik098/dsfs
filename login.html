<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Moneyway Social — Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Sora:wght@300;400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body class="page-auth" data-page="login">
  <div class="bg-orb bg-orb-a"></div>
  <div class="bg-orb bg-orb-b"></div>
  <div class="bg-grid"></div>

  <main class="auth">
    <div class="auth-card glass">
      <div class="brand auth-brand">
        <div class="brand-icon">MW</div>
        <div>
          <div class="brand-title">Moneyway</div>
          <div class="brand-subtitle">Welcome back</div>
        </div>
      </div>
      <h1>Sign in to continue</h1>
      <p class="muted">Access your projects, messages, and community.</p>

      <form class="auth-form">
        <label>
          Email
          <input type="email" placeholder="you@studio.com" required />
        </label>
        <label>
          Password
          <input type="password" placeholder="••••••••" required />
        </label>
        <div class="auth-row">
          <label class="checkbox">
            <input type="checkbox" />
            <span>Keep me signed in</span>
          </label>
          <a href="#">Forgot password?</a>
        </div>
        <button class="btn btn-primary btn-block" type="submit">Sign In</button>
        <button class="btn btn-secondary btn-block" type="button"><i class="fa-brands fa-google"></i> Continue with Google</button>
      </form>

      <div class="auth-footer">
        New here? <a href="register.html">Create an account</a>
      </div>
    </div>
  </main>

  <script src="assets/js/app.js"></script>
</body>
</html>
